<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf8">
  <meta name="description" content="走到景点，听一段有出处的讲解。">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <title>沿途 · 景点讲解</title>
</head>
<body>
  <header class="topbar"><div class="brand">沿途 <span>/ YAN TU</span></div></header>
  <main>
    <section class="home-intro"><h1>走到哪，讲到哪</h1><p>到点听讲解，找到眼前的细节；想去下一站，直接看步行路线。</p></section>
    <section class="hero">
      <h2>到点讲解</h2>
      <div class="hero-actions"><button id="locate" class="primary">开启到点讲解</button><span id="location-status" role="status">定位尚未开启</span></div>
    </section>

    <nav class="explore-actions" aria-label="按当前位置探索"><button type="button" data-explore="food">吃什么</button><button type="button" data-explore="fun">玩什么</button><button type="button" data-explore="night">找夜景</button><button type="button" data-explore="show">找演出</button></nav>
    <section id="explore-panel" class="explore-panel hidden" role="status"></section>
    <section class="section-heading"><h2>选择眼前的地方</h2><div class="heading-rate"><span>语速</span><div id="speech-rate" class="rate-options" role="group" aria-label="语速"><button type="button" data-rate="0.78">舒缓</button><button type="button" data-rate="1.0">自然</button><button type="button" data-rate="1.25">明快</button></div></div></section>
    <div id="places" class="place-list" aria-live="polite"></div>

    <section id="detail" class="detail hidden" aria-live="polite">
      <div class="detail-heading"><div><small id="detail-area"></small><h2 id="detail-name"></h2></div><details id="sources-panel" class="sources-popover"><summary>资料来源 ↗</summary><ul id="sources"></ul></details></div>
      <p id="detail-intro" class="intro"></p>
      <h3>到现场看哪里</h3><p id="detail-look" class="intro"></p>
      <h3>再听一段 · 历史与典故</h3><p id="detail-story" class="intro"></p>
      <p class="hint">路线由高德地图规划。这里的距离是直线距离；岔路转向以地图和现场标识为准。</p>
      <div id="artifact-section" class="hidden"><h3>馆内值得看</h3><p class="hint">看到展品后再点；室内定位无法辨认展柜。</p><div id="artifacts" class="artifact-list"></div></div>
      <h3 id="ask-title">接着问</h3>
      <p id="ask-hint" class="hint">根据已核实资料回答。</p>
      <form id="ask-form">
        <label class="sr-only" for="question">你想问什么</label>
        <textarea id="question" maxlength="600" rows="2" placeholder="比如：这里为什么叫爱晚亭？" required></textarea>
        <div class="ask-tools"><label id="photo-button" class="photo-button" for="photo">＋ 照片（可选）</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"><button id="voice" type="button" class="outline">🎙 说话提问</button><button id="ask" type="submit" class="primary">问一问</button></div>
        <div id="photo-name" class="hint"></div>
      </form>
      <div id="answer" class="answer hidden" role="status"></div>
      <button id="collapse-detail" type="button" class="collapse-detail">⌃ 收起讲解</button>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
